# /etc/nginx/conf.d/agents-rate-limit.conf
#
# http-context shared state for the agents.nexoratech.co vhost.
# Zone NAMES must not change: the live vhost references them by name, so a
# rename turns a reload into an outage.
#
# rate=50r/s (600r/m) replaces the deployed rate=60r/m. 60r/m refills one
# request per second, which a single n8n editor load (40+ parallel asset
# chunks) drains instantly no matter how large burst= is -- that starvation is
# what froze the dashboard on "connecting..." and blanked /automation/.
# 10r/s absorbs a full UI load every second while still stopping scripted
# abuse; limit_conn below stays the real concurrency guard.
limit_req_zone $binary_remote_addr zone=agents_per_ip:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=agents_conn_per_ip:10m;

# The n8n editor opens a push channel over WebSocket. Connection must be
# "upgrade" only for requests that actually ask for it, so it is derived from
# the request rather than hard-coded in the vhost.
map $http_upgrade $agents_connection_upgrade {
    default upgrade;
    ''      close;
}
