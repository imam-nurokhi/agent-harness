# /etc/nginx/sites-available/agents.nexoratech.co
#
# Reviewed artefact for the shared VPS 31.97.67.241. Requires the zones and the
# $agents_connection_upgrade map from conf.d/agents-rate-limit.conf.
#
# Three deliberate differences from what was deployed before this pass:
#   1. the sustained rate in the zone file (see that file);
#   2. Upgrade/Connection are forwarded to n8n, which the deployed vhost never
#      did, so the editor's push channel could not establish;
#   3. the /automation/ prefix is stripped before the upstream, and the bare
#      /automation URL redirects to the trailing-slash form.
# Everything else is preserved byte-for-byte from the live config: this change
# must not loosen anything that was already hardened.

server {
    listen 80;
    server_name agents.nexoratech.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name agents.nexoratech.co;

    ssl_certificate /etc/letsencrypt/live/agents.nexoratech.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.nexoratech.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 256k;
    limit_req zone=agents_per_ip burst=1200 nodelay;
    limit_req_status 429;
    # Under HTTP/2 nginx counts each stream as a connection for limit_conn, so
    # the two numbers below are one decision. The stream ceiling is pinned
    # rather than inherited, and limit_conn keeps 2x headroom over it: at 64 an
    # ordinary editor load still answered 503 x 407.
    http2_max_concurrent_streams 128;
    limit_conn agents_conn_per_ip 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # img-src adds data: only. The dashboard's favicon is an inline SVG data URI
    # and was the one thing this policy actually broke; everything else the
    # editor needs is same-origin. Verified in a headless browser: the n8n
    # editor renders under this exact policy, its only violation being Vite's
    # `import 'data:text/javascript,...'` modern-browser probe, which Vite
    # catches itself. Do not widen this because a page looks blank -- that was
    # the rate limit and the /automation/ prefix, not the CSP.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    auth_basic "Nexora Agent Command Center";
    auth_basic_user_file /etc/nginx/.agents.htpasswd;

    # "^~ /automation/" never matches the bare "/automation", which would
    # otherwise fall through to the dashboard upstream below.
    location = /automation { return 301 https://$host/automation/; }

    location ^~ /automation/ {
        # The trailing slash is load-bearing: it strips "/automation/" before
        # the upstream. n8n 2.39.6 serves its bundles from the server ROOT
        # (/assets/..., /static/...) and no longer mounts them under N8N_PATH;
        # N8N_PATH only still sets the prefix the HTML references. Keeping the
        # prefix here makes every asset resolve to the SPA catch-all
        # (200 text/html, 56733 bytes) instead of the bundle, and `nosniff`
        # then stops the browser executing it -- a blank white editor.
        # Verified in a headless browser against a loopback staging block
        # before this was deployed.
        proxy_pass http://127.0.0.1:5678/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agents_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /automation;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # --- Prototype review surfaces, added 2026-09-17 -----------------------
    # Three read-only prototypes published for a management overview while the
    # dev-academy / dev-accreditation / dev-servicedesk hostnames do not yet
    # exist in DNS. `^~` keeps each one ahead of the regex locations and well
    # clear of `/` (the Command Center on :7777) and `/automation/` (n8n on
    # :5678) -- neither of those is touched by these blocks.
    #
    # `root` (not `alias`) because the directory names under /var/www/prototypes
    # match the URL prefixes exactly, which sidesteps the alias+try_files
    # path-resolution trap.
    #
    # Each block restates every security header: an `add_header` anywhere in a
    # location REPLACES the entire inherited set rather than adding to it, so
    # omitting one here would silently drop it for that path.
    #
    # Auth is deliberately a DIFFERENT htpasswd from the Command Center's, so
    # reviewers who get the prototype credential cannot reach the harness.

    location = /academy     { return 301 https://$host/academy/; }
    location = /accreditation { return 301 https://$host/accreditation/; }
    location = /servicedesk { return 301 https://$host/servicedesk/; }

    location ^~ /academy/ {
        root /var/www/prototypes;
        try_files $uri $uri/ /academy/index.html;

        # A missing asset must 404, not fall through to the SPA shell. Without
        # this, try_files hands back index.html as 200 text/html for a .js URL
        # -- the same silent break that made every n8n bundle look healthy to a
        # status-only check while the editor rendered blank. Verified with a
        # deliberate request for a non-existent asset.
        # No add_header here on purpose: a location inherits the parent's full
        # header set only while it declares none of its own.
        location ~* ^/academy/.+\.(js|mjs|css|map|json|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            try_files $uri =404;
        }

        auth_basic "Nexora Prototype Review";
        auth_basic_user_file /etc/nginx/.prototypes.htpasswd;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # The bundle injects a Google Fonts <link> at runtime, so it is invisible
        # to a static grep of the HTML and only a real browser load reveals it.
        # The two font origins are the only relaxation, and only for this path.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:" always;
    }

    location ^~ /accreditation/ {
        root /var/www/prototypes;
        try_files $uri $uri/ /accreditation/index.html;

        # A missing asset must 404, not fall through to the SPA shell. Without
        # this, try_files hands back index.html as 200 text/html for a .js URL
        # -- the same silent break that made every n8n bundle look healthy to a
        # status-only check while the editor rendered blank. Verified with a
        # deliberate request for a non-existent asset.
        # No add_header here on purpose: a location inherits the parent's full
        # header set only while it declares none of its own.
        location ~* ^/accreditation/.+\.(js|mjs|css|map|json|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            try_files $uri =404;
        }

        auth_basic "Nexora Prototype Review";
        auth_basic_user_file /etc/nginx/.prototypes.htpasswd;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # This build pulls its webfont stylesheet from Google Fonts; the two
        # font origins are the only relaxation, and only for this path.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:" always;
    }

    location ^~ /servicedesk/ {
        root /var/www/prototypes;
        try_files $uri $uri/ /servicedesk/index.html;

        # A missing asset must 404, not fall through to the SPA shell. Without
        # this, try_files hands back index.html as 200 text/html for a .js URL
        # -- the same silent break that made every n8n bundle look healthy to a
        # status-only check while the editor rendered blank. Verified with a
        # deliberate request for a non-existent asset.
        # No add_header here on purpose: a location inherits the parent's full
        # header set only while it declares none of its own.
        location ~* ^/servicedesk/.+\.(js|mjs|css|map|json|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
            try_files $uri =404;
        }

        auth_basic "Nexora Prototype Review";
        auth_basic_user_file /etc/nginx/.prototypes.htpasswd;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Tailwind's CDN build is vendored into the bundle, so 'self' suffices.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:" always;
    }
    # --- widget feedback collector, added 2026-09-18 -----------------------
    # AI Assistant widget rollout, Fase 1 (docs/ai-assistant-widget-rollout-
    # plan.md): additive only, does not touch the three location blocks
    # above. Same prototype credential (a reviewer who can open the widget
    # can already reach the app it is attached to) but its OWN htpasswd
    # realm string, and X-Remote-User/X-Real-IP are set here so the
    # collector can treat them as server-asserted, not client-suppliable.
    location ^~ /widget-feedback/ {
        auth_basic "Nexora Prototype Review";
        auth_basic_user_file /etc/nginx/.prototypes.htpasswd;

        proxy_pass http://127.0.0.1:7788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Real-IP $remote_addr;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'none'; style-src 'none'" always;
    }
    # --- end prototype review surfaces -------------------------------------

    location / {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
